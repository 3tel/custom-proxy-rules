name: Build rules and deploy website

on:
  workflow_dispatch:
  schedule:
    - cron: "23 20 * * *"
  push:
    branches: [main]
    paths:
      - "config/**"
      - "rules/**"
      - "scripts/**"
      - "test/**"
      - "docs/**"
      - "package.json"
      - ".github/workflows/build.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test
        run: npm test
      - name: Build rules
        run: npm run build
      - name: Prepare website
        run: |
          mkdir -p _site/rules
          cp -R docs/. _site/
          cp dist/shadowrocket/*.list _site/rules/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Commit generated rules
        run: |
          git add -f dist build-report.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update generated rules"
          git push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

