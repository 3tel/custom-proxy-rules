name: Build rules

on:
  workflow_dispatch:
  schedule:
    - cron: "23 20 * * *"
  push:
    branches: [main]
    paths:
      - "config/**"
      - "rules/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"

permissions:
  contents: write

concurrency:
  group: build-rules
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: python -m unittest discover -s tests
      - name: Build
        run: PYTHONPATH=src python -m custom_proxy_rules
      - name: Commit generated rules
        run: |
          git add -f dist build-report.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update generated rules"
          git push

