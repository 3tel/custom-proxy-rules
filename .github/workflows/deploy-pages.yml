name: Deploy website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "dist/shadowrocket/*.list"
      - "test/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/build-web.mjs"
      - ".github/workflows/deploy-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Prepare website
        run: |
          npm run build:web
          mkdir -p _site/rules
          cp dist/shadowrocket/*.list _site/rules/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
