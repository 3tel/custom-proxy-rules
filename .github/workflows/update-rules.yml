name: Update rules

on:
  workflow_dispatch:
  schedule:
    - cron: "23 20 * * *"
  push:
    branches: [main]
    paths:
      - "config/**"
      - "rules/**"
      - "scripts/**"
      - "test/**"
      - "package.json"
      - ".github/workflows/update-rules.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Download and build rules
        run: npm run build
      - name: Prepare website
        run: |
          npm run build:web
          mkdir -p _site/rules
          cp dist/shadowrocket/*.list _site/rules/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Commit generated rules
        run: |
          git add -f dist build-report.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: update generated rules"
          git push

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
