[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "custom-proxy-rules"
version = "0.1.0"
description = "Build maintainable proxy routing rules from public sources and local overrides."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "3tel" }]
dependencies = []

[project.scripts]
proxy-rules = "custom_proxy_rules.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/custom_proxy_rules"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

